<app-header-menu />

@if (page() === 'home') {
  <div class="top-banner active">
    <img src="/banner-bw.JPEG" alt="Татьяна Стафиевская - Колорист Matrix" class="banner-image" />
  </div>
}

<div id="products-title">
  <img src="/matrix-logo.png" alt="Matrix Logo" class="matrix-logo" />
</div>

@if (breadcrumbHtml()) {
  <div class="breadcrumb-path" style="display: block !important" [innerHTML]="breadcrumbHtml()"></div>
}

@if (authorBannerVisible()) {
  <div class="author-banner">
    <h2 class="author-title">Авторская студия Татьяны Стафиевской</h2>
    <p class="author-subtitle">Амбассадор бренда Matrix. Hair-stylist. Colorist.</p>
  </div>
}

<div class="main-nav-buttons">
  <button class="main-nav-button" routerLink="/price">Price</button>
  <button class="main-nav-button" routerLink="/catalog">Каталог Matrix</button>
</div>

@if (productsMainImageVisible()) {
  <img src="/products/main.jpg" alt="Matrix Products" class="products-main-image active" />
}

<div class="container">
  <router-outlet />
</div>

<!-- Fixed WhatsApp Icon -->
<a href="https://wa.me/77058881285" class="fixed-whatsapp">
  <img src="/images/whatsapp-icon.svg" alt="WhatsApp" class="fixed-whatsapp-icon" />
</a>
